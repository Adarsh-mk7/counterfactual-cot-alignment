# Evaluation & Inference Sampling Configurations
evaluation:
  model_name_or_path: "meta-llama/Meta-Llama-3-8B-Instruct"
  adapter_path: null  # Set to "./aligned_model_lora" when evaluating DPO aligned checkpoint
  data_path: "data/perturbed/gsm8k_sycophancy.json"
  output_metrics_path: "results/eval_metrics.json"
  output_predictions_path: "results/predictions.jsonl"
  tensor_parallel_size: 1
  max_model_len: 2048

sampling:
  temperature: 0.0
  max_tokens: 512
  top_p: 1.0

metrics:
  compute_accuracy: true
  compute_sycophancy_yield_rate: true
